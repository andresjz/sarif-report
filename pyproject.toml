[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "sarif-report"
version = "0.1.0"
description = "Deterministic HTML report generator from SARIF (Static Analysis Results Interchange Format) output"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "andresjz" }]
keywords = ["sarif", "static-analysis", "report", "html", "qlty"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/andresjz/sarif-report"
Repository = "https://github.com/andresjz/sarif-report"

[project.scripts]
sarif-report = "sarif_report.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sarif_report"]

[tool.hatch.build.targets.wheel.force-include]
"src/sarif_report/template.html" = "sarif_report/template.html"

[tool.hatch.build.targets.sdist]
include = ["src/sarif_report", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
